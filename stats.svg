    <text x="340" y="80" font-family="'Courier New',monospace" font-size="10" fill="#e2e8f0">Swift / SwiftUI</text>
    <rect x="460" y="72" width="165" height="5" rx="2" fill="#2a0050"/>
    <g clip-path="url(#rightBars)">
      <rect x="460" y="72" width="0" height="5" rx="2" fill="#f0abfc">
        <animate attributeName="width" from="0" to="140" dur="1.5s" fill="freeze"/>
      </rect>
    </g>
    <text x="636" y="79" font-family="'Courier New',monospace" font-size="10" fill="#f0abfc">85%</text>

    
    <text x="340" y="128" font-family="'Courier New',monospace" font-size="10" fill="#e2e8f0">React(JS/Native)</text>
    <rect x="460" y="96" width="165" height="5" rx="2" fill="#2a0050"/>
    <g clip-path="url(#rightBars)">
      <rect x="460" y="96" width="0" height="5" rx="2" fill="#c084fc">
        <animate attributeName="width" from="0" to="99" dur="1.7s" fill="freeze"/>
      </rect>
    </g>
    <text x="636" y="103" font-family="'Courier New',monospace" font-size="10" fill="#c084fc">60%</text>
    <text x="340" y="152" font-family="'Courier New',monospace" font-size="10" fill="#e2e8f0">HTML / CSS / JS</text>
    
    <rect x="460" y="120" width="165" height="5" rx="2" fill="#2a0050"/>
    <g clip-path="url(#rightBars)">
      <rect x="460" y="120" width="0" height="5" rx="2" fill="#67e8f9">
        <animate attributeName="width" from="0" to="66" dur="1.9s" fill="freeze"/>
      </rect>
    </g>
    <text x="636" y="127" font-family="'Courier New',monospace" font-size="10" fill="#67e8f9">40%</text>

    <text x="340" y="104" font-family="'Courier New',monospace" font-size="10" fill="#e2e8f0">Python</text>
    <rect x="460" y="144" width="165" height="5" rx="2" fill="#2a0050"/>
    <g clip-path="url(#rightBars)">
      <rect x="460" y="144" width="0" height="5" rx="2" fill="#a5f3fc">
        <animate attributeName="width" from="0" to="33" dur="2.1s" fill="freeze"/>
      </rect>
    </g>
    <text x="636" y="151" font-family="'Courier New',monospace" font-size="10" fill="#a5f3fc">20%</text>

    <!-- Divider -->
    <line x1="672" y1="44" x2="672" y2="162" stroke="#c084fc" stroke-width="0.6" opacity="0.22"/>

    <!-- RIGHT: quick facts -->
    <text x="692" y="60" font-family="'Courier New',monospace" font-size="9" fill="#9aa5c4" letter-spacing="2">QUICK FACTS</text>
    <text x="692" y="80"  font-family="'Courier New',monospace" font-size="10" fill="#a8b2c9">based in  <tspan fill="#67e8f9" font-weight="700">🇨🇦 YYC</tspan></text>
    <text x="692" y="98"  font-family="'Courier New',monospace" font-size="10" fill="#a8b2c9">founded   <tspan fill="#c084fc" font-weight="700">PellTech</tspan></text>
    <text x="692" y="116" font-family="'Courier New',monospace" font-size="10" fill="#a8b2c9">pirate    <tspan fill="#f0abfc" font-weight="700">🏴‍☠️ yes</tspan></text>
    <text x="692" y="134" font-family="'Courier New',monospace" font-size="10" fill="#a8b2c9">status    <tspan fill="#4ade80" font-weight="700">open ✦</tspan></text>
    <text x="692" y="152" font-family="'Courier New',monospace" font-size="10" fill="#a8b2c9">sleep     <tspan fill="#a855f7" font-weight="700">eventually</tspan></text>

    <!-- Neon border flicker -->
    <rect width="900" height="180" rx="10" fill="none" stroke="#f0abfc" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.6;0.1;0;0;0;0;0;0.8;0.05;0;0;0;0;0.4;0;0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="180" rx="10" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;0.5;0;0;0;0;0;0;0.3;0;0;0;0;0" dur="7s" repeatCount="indefinite"/>
    </rect>
